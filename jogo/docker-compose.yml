version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cryptorealm-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cryptorealm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: cryptorealm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./server/backend
      dockerfile: Dockerfile
    container_name: cryptorealm-backend
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/cryptorealm
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-in-production}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Telegram Bot
  bot:
    build:
      context: ./server/bot
      dockerfile: Dockerfile
    container_name: cryptorealm-bot
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      WEBAPP_URL: ${WEBAPP_URL:-https://tma.cryptorealm.io}
      API_BASE: http://backend:3001/api
    depends_on:
      - backend
    restart: unless-stopped

  # TMA Frontend (served by nginx)
  tma:
    build:
      context: ./server/tma
      dockerfile: Dockerfile
    container_name: cryptorealm-tma
    ports:
      - "8080:80"
    restart: unless-stopped

  # Admin Dashboard
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: cryptorealm-admin
    ports:
      - "3000:3000"
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-admin-secret}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
